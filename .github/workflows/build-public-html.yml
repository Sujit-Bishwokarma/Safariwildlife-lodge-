name: Build Website for public_html

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Complete Static Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          ls -la dist

      - name: Upload public_html website artifact
        uses: actions/upload-artifact@v4
        with:
          name: public_html-website
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
