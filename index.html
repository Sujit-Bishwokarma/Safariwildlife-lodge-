<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safari Wildlife Lodge & Camp | Stay Close to Nature, Closer to Adventure</title>
  </head>
  <body>
    <!-- Hidden frame to prevent page refresh on native submit of booking form in JS-based SPAs -->
    <iframe name="form-submit-iframe" id="form-submit-iframe" style="display: none;"></iframe>

    <!-- Hidden form wrapper for Bisup Form recognition and processing on cPanel-based web hosting.
         We keep it in an active layout boundary so that third-party form engines and scraper tools can easily process it. -->
    <div style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(1px, 1px, 1px, 1px); opacity: 0; pointer-events: none; z-index: -9999;">
      <form 
        id="bisup-booking-form"
        name="booking-form" 
        method="POST" 
        action="" 
        target="form-submit-iframe"
        data-bisup-form="true"
      >
        <input type="hidden" name="form-name" value="booking-form" />
        <input type="text" name="guestName" id="bisup_guestName" />
        <input type="text" name="contactValue" id="bisup_contactValue" />
        <input type="text" name="checkIn" id="bisup_checkIn" />
        <input type="text" name="checkOut" id="bisup_checkOut" />
        <input type="number" name="guestsCount" id="bisup_guestsCount" />
        <input type="text" name="roomName" id="bisup_roomName" />
        <input type="text" name="totalPricing" id="bisup_totalPricing" />
        <button type="submit" id="bisup-submit-btn">Submit Booking</button>
      </form>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
