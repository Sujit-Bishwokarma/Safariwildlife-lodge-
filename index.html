<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safari Wildlife Lodge & Camp | Stay Close to Nature, Closer to Adventure</title>
  </head>
  <body>
    <!-- Hidden frame to prevent page refresh on native submit of booking form in JS-based SPAs -->
    <iframe name="form-submit-iframe" id="form-submit-iframe" style="display: none;"></iframe>

    <!-- Hidden form for Netlify and Bisup Form recognition and processing -->
    <form 
      id="bisup-booking-form"
      name="booking-form" 
      method="POST" 
      action="" 
      target="form-submit-iframe"
      data-netlify="true" 
      netlify-honeypot="bot-field" 
      style="display: none;"
    >
      <input type="hidden" name="form-name" value="booking-form" />
      <input type="hidden" name="bot-field" />
      <input type="text" name="guestName" />
      <input type="text" name="contactValue" />
      <input type="text" name="checkIn" />
      <input type="text" name="checkOut" />
      <input type="number" name="guestsCount" />
      <input type="text" name="roomName" />
      <input type="text" name="totalPricing" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
