[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[form]
  [[form.fields]]
    name = "guestName"
    required = true
  [[form.fields]]
    name = "contactValue"
    required = true
  [[form.fields]]
    name = "checkIn"
    required = true
  [[form.fields]]
    name = "checkOut"
    required = true
